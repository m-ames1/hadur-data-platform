[project]
name = "hadur-data-platform"
version = "0.4.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deltalake>=1.6.6",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
