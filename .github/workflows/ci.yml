name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - uses: astral-sh/setup-uv@v5
            with:
              enable-cache: true

          - name: Install Python
            run: uv python install

          - name: Install dependencies
            run: uv sync --locked
          
          - name: Verify requirements.txt is in sync
            run: |
              uv export --no-dev --format requirements.txt --output-file=/tmp/requirements.txt
              diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)

          - name: Lint
            run: uv run ruff check .

          - name: Format check
            run: uv run ruff format --check

          - name: Pytests
            run: uv run pytest
