name: Sync requirements.txt for Dependabot

on:
  pull_request:

permissions:
  contents: read

jobs:
  sync-requirements:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.DEPENDABOT_SYNC_TOKEN }}

      - uses: astral-sh/setup-uv@v5

      - name: Regenerate requirements.txt
        run: uv export --no-dev --format requirements.txt --output-file requirements.txt

      - name: Commit if it changed
        run: |
          if ! git diff --quiet requirements.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add requirements.txt
            git commit -m "chore: regenerate requirements.txt"
            git push
          fi
