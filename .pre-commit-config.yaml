fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.20
    hooks:
    - id: uv-lock
    - id: uv-export
      args: ["--no-dev", "--format", "requirements.txt", "--output-file=requirements.txt"]
